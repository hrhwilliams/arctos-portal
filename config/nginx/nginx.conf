# /etc/nginx/nginx.conf
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # Traffic arrives via the cloudflared container on the compose bridge network,
  # not from Cloudflare's public ranges, so that is what we trust here. nginx is
  # not published to the host (see compose.yml), so only the tunnel can reach it.
  # If nginx is ever exposed to Cloudflare directly, swap this for the edge list
  # at https://www.cloudflare.com/ips/ .
  set_real_ip_from 172.16.0.0/12;
  real_ip_header CF-Connecting-IP;

  # /api/download is expensive: one request per 10s per client, small burst.
  limit_req_zone $binary_remote_addr zone=download:10m rate=6r/m;
  limit_req_status 429;

  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tpt-portal.fiatlux.dev;

    add_header X-Frame-Options DENY always;

    ssl_certificate /etc/ssl/certs/chain.pem;
    ssl_certificate_key /etc/ssl/certs/fiatlux.dev.key;

    ssl_protocols TLSv1.3;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_prefer_server_ciphers off;

    ssl_stapling on;
    ssl_stapling_verify on;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
      proxy_pass http://backend:8080;
    }

    location = /api/download {
      limit_req zone=download burst=2 nodelay;
      proxy_pass http://backend:8080;
      proxy_read_timeout 300s;
    }
  }
}